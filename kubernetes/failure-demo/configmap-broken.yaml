# FAILURE DEMO ONLY. Same ConfigMap, but MODEL_PATH points to a file that does not exist,
# so the API cannot start. Apply it to practise diagnosing, then re-apply ../configmap.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cancer-api-config
  namespace: mlops
data:
  APP_VERSION: "1.0.0"
  MODEL_PATH: "/app/model/missing-model.joblib"
  MODEL_INFO_PATH: "/app/model/model_info.json"
  LOG_LEVEL: "INFO"
