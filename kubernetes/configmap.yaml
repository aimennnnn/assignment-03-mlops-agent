# Non-sensitive settings for the prediction API. The Deployment loads these as
# environment variables, so they can change without rebuilding the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cancer-api-config
  namespace: mlops
data:
  APP_VERSION: "1.0.0"
  MODEL_PATH: "/app/model/model.joblib"
  MODEL_INFO_PATH: "/app/model/model_info.json"
  LOG_LEVEL: "INFO"
